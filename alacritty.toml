[window]
# 0.0 is completely transparent, 1.0 is completely solid
opacity = 0.70
decorations = "None"

# Adds a blur effect behind the window (Windows 11 / modern Windows 10)
blur = true

# Optional: Internal window padding so text doesn't touch the edge
padding = { x = 12, y = 12 }

# Optional: Make PowerShell your default shell instead of CMD
[terminal.shell]
program = "powershell.exe"

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"