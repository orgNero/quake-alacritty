name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run workflow checks
        shell: powershell
        run: .\tests\run-workflow-checks.ps1

      - name: Install test dependencies
        shell: powershell
        run: .\tests\install-test-deps.ps1

      - name: Run lint
        shell: powershell
        run: .\tests\run-lint.ps1

      - name: Run tests
        shell: powershell
        run: .\tests\run-tests.ps1

      - name: Install AutoHotkey v2
        shell: powershell
        run: |
          choco install autohotkey --yes --no-progress
          $ahkPath = Join-Path $env:ProgramFiles 'AutoHotkey\v2\AutoHotkey64.exe'
          if (-not (Test-Path -LiteralPath $ahkPath)) {
            Write-Error "AutoHotkey64.exe not found at $ahkPath"
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "QUAKE_AHK=$ahkPath"

      - name: Run self-test
        shell: powershell
        run: .\tests\run-selftest.ps1

      - name: Installer smoke
        shell: powershell
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'quake-appdata'
          New-Item -ItemType Directory -Path $env:APPDATA -Force | Out-Null
          & ./src/install.ps1 -DryRun -NonInteractive -Shell keep
